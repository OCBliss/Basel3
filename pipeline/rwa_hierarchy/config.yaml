# Independent RWA workflow; the Call Report/JSD execution list is unchanged.
# Choose a NEW output_dir for each run. Existing results are never overwritten.
parameters:
  output_dir: RWA/Experimental/HIERARCHY/run
  yield_window: 2520
  parameter_window: 252
  recent_rows: 3024
  paths: 256
  steps: 20
  substeps: 4
  seed: 1234
  noise_replicates: 0
  time_basis: observation
  missing_policy: forward-fill
  dt: 0.003968253968253968
  forecast_mode: recursive
  recalibrate_every: 1

scripts:
  rwa_hierarchy:
    path: RWA/models/parameter_hierarchy/workflow.py
    args:
      - --output
      - "{output_dir}"
      - --yield-window
      - "{yield_window}"
      - --parameter-window
      - "{parameter_window}"
      - --recent-rows
      - "{recent_rows}"
      - --paths
      - "{paths}"
      - --steps
      - "{steps}"
      - --substeps
      - "{substeps}"
      - --seed
      - "{seed}"
      - --noise-replicates
      - "{noise_replicates}"
      - --time-basis
      - "{time_basis}"
      - --missing-policy
      - "{missing_policy}"
      - --dt
      - "{dt}"
      - --forecast-mode
      - "{forecast_mode}"
      - --recalibrate-every
      - "{recalibrate_every}"
    inputs: ["RWA/FRED/DGS*.csv"]
    outputs:
      - "{output_dir}/manifest.json"
      - "{output_dir}/yield_parameters.csv"
      - "{output_dir}/parameter_dynamics.csv"
      - "{output_dir}/transition_intervals.csv"
      - "{output_dir}/scenario_summary.csv"
      - "{output_dir}/scenarios.npz"

dependencies: {}

execution:
  - sequential: [rwa_hierarchy]
