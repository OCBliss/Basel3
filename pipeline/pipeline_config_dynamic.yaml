# pipeline_config_dynamic.yaml

# One selection is expanded into both argv and expected artifact paths.
parameters:
  horizons: [1, 2, 3, 4]
  bins1: [20, 30, 50, 100]
  bins2: 5
  bins3: 1

scripts:
  "0.0":
    path: "call reports/prepare_call_reports.py"
    args:
      - --config
      - "{config_path}"
      - --txt-dir
      - "data/TXT"
      - --cache-dir
      - "data/FFIEC"
      - --manifest
      - "data/FFIEC/prepared.json"
    outputs: ["data/FFIEC/prepared.json", "data/TXT/*/*.txt"]
    create_dirs: ["data/FFIEC"]
  "1.0":
    path: "call reports/call_reports_mkdir_txt_csvs_global.py"
    inputs: ["data/TXT/*/*.txt"]
    outputs: ["data/CSV/Schedules/*/*.csv"]
    create_dirs: ["data/CSV/Schedules"]
  "2.0":
    path: "call reports/Call_Report_Merged_Cleaned_Global.py"
    inputs: ["data/CSV/Schedules/*/*.csv"]
    outputs: ["data/CSV/Cleaned/*.csv"]
    create_dirs: ["data/CSV/Cleaned"]
  "2.1":
    path: "call reports/numeric_only.py"
    inputs: ["data/CSV/Cleaned/*.csv"]
  "3.0":
    path: "call reports/Call_Reports_v4_0.py"
    args:
      - --input-dir
      - "data/CSV/Cleaned"
      - --output-dir
      - "data/CSV/Interleaved"
      - --quarter-map
      - "data/CSV/quarter_flag.csv"
      - --date
      - P0
    inputs: ["data/CSV/Cleaned/*.csv", "data/CSV/quarter_flag.csv"]
    outputs: ["data/CSV/Interleaved/*.csv"]
    create_dirs: ["data/CSV/Interleaved"]
  "4.0":
    path: "ratios/Dynamic_Ratios.py"
    inputs:
      - "data/CSV/Cleaned/*.csv"
      - "data/CSV/Interleaved/*.csv"
      - "data/CSV/quarter_flag.csv"
    outputs: ["data/CSV/Dynamic_Lag/Cleaned/*.csv"]
    create_dirs: ["data/CSV/Dynamic_Lag/Cleaned"]
  "6.0.1":
    path: "material events/FDIC API/Material_events_download.py"
    args:
      - --events
      - de_novo
      - --material-dir
      - "Material Events"
      - --start-date
      - "2014-01-01"
      - --end-date
      - "2024-12-31"
      - --limit
      - 10000
    outputs: ["Material Events/DE NOVO/RAW/BankFind Suite API - de novo.csv"]
    create_dirs: ["Material Events/DE NOVO/RAW"]
  "6.0.2":
    path: "material events/FDIC API/Material_events_download.py"
    args:
      - --events
      - failures
      - --material-dir
      - "Material Events"
      - --start-date
      - "2014-01-01"
      - --end-date
      - "2024-12-31"
      - --limit
      - 10000
    outputs: ["Material Events/Failures/RAW/BankFind Suite API - Failures.csv"]
    create_dirs: ["Material Events/Failures/RAW"]
  "6.0.3":
    path: "material events/FDIC API/Material_events_download.py"
    args:
      - --events
      - mergers
      - --material-dir
      - "Material Events"
      - --start-date
      - "2014-01-01"
      - --end-date
      - "2024-12-31"
      - --limit
      - 10000
    outputs: ["Material Events/Mergers/RAW/BankFind Suite API - mergers.csv"]
    create_dirs: ["Material Events/Mergers/RAW"]
  "6.1":
    path: "material events/FDIC API/Material_events_cleaned.py"
    args:
      - --events
      - de_novo
      - failures
      - mergers
      - --material-dir
      - "Material Events"
    inputs:
      - "Material Events/DE NOVO/RAW/*.csv"
      - "Material Events/Failures/RAW/*.csv"
      - "Material Events/Mergers/RAW/*.csv"
    outputs:
      - "Material Events/DE NOVO/Cleaned/*.csv"
      - "Material Events/Failures/Cleaned/*.csv"
      - "Material Events/Mergers/Cleaned/*.csv"
    create_dirs:
      - "Material Events/DE NOVO/Cleaned"
      - "Material Events/Failures/Cleaned"
      - "Material Events/Mergers/Cleaned"
  "6.1.1":
    path: "material events/FDIC API/Material_events_delete_api.py"
    args:
      - --events
      - de_novo
      - failures
      - mergers
      - --material-dir
      - "Material Events"
    inputs:
      - "Material Events/DE NOVO/RAW/*.csv"
      - "Material Events/Failures/RAW/*.csv"
      - "Material Events/Mergers/RAW/*.csv"
  "6.2":
    path: "material events/Material_events_flag.py"
    args:
      - --events
      - de_novo
      - --material-dir
      - "Material Events"
      - --input-dir
      - "data/CSV/Dynamic_Lag/Cleaned"
      - --output-dir
      - "Material Events/DE NOVO/Call Reports"
      - --quarter-map
      - "Material Events/quarters_de_novo.csv"
    inputs:
      - "data/CSV/Dynamic_Lag/Cleaned/*.csv"
      - "Material Events/DE NOVO/Cleaned/*.csv"
      - "Material Events/quarters_de_novo.csv"
    outputs: ["Material Events/DE NOVO/Call Reports/*.csv"]
    create_dirs: ["Material Events/DE NOVO/Call Reports"]
  "6.3":
    path: "material events/Material_events_flag.py"
    args:
      - --events
      - failures
      - --material-dir
      - "Material Events"
      - --input-dir
      - "Material Events/DE NOVO/Call Reports"
      - --output-dir
      - "Material Events/Failures/Call Reports"
      - --quarter-map
      - "Material Events/quarters_failures.csv"
    inputs:
      - "Material Events/DE NOVO/Call Reports/*.csv"
      - "Material Events/Failures/Cleaned/*.csv"
      - "Material Events/quarters_failures.csv"
    outputs: ["Material Events/Failures/Call Reports/*.csv"]
    create_dirs: ["Material Events/Failures/Call Reports"]
  "6.4":
    path: "material events/Material_events_flag.py"
    args:
      - --events
      - mergers
      - --material-dir
      - "Material Events"
      - --input-dir
      - "Material Events/Failures/Call Reports"
      - --output-dir
      - "Material Events/Mergers/Call Reports"
      - --quarter-map
      - "Material Events/quarters_failures.csv"
    inputs:
      - "Material Events/Failures/Call Reports/*.csv"
      - "Material Events/Mergers/Cleaned/*.csv"
      - "Material Events/quarters_failures.csv"
    outputs: ["Material Events/Mergers/Call Reports/*.csv"]
    create_dirs: ["Material Events/Mergers/Call Reports"]
  "7.0":
    path: "peer groups/base/Material_events_peer_group_basel3.py"
    args: ["--horizons","{horizons}","--material-dir","Material Events","--input-dir","Material Events/Mergers/Call Reports"]
    inputs: ["Material Events/Mergers/Call Reports/*.csv"]
    outputs: ["Material Events/Failures/Horizons/Basel III T+{horizons}/*.csv","Material Events/Mergers/Horizons/Basel III T+{horizons}/*.csv","Material Events/Survivors/Horizons/Basel III T+{horizons}/*.csv"]
  "7.1":
    path: "peer groups/horizons/Material_events_peer_group_basel3.py"
    args: ["--horizons","{horizons}","--material-dir","Material Events","--quarter-map","Material Events/quarters_basel3.csv"]
    inputs: ["Material Events/Failures/Horizons/Basel III T+{horizons}/*.csv","Material Events/Mergers/Horizons/Basel III T+{horizons}/*.csv","Material Events/Survivors/Horizons/Basel III T+{horizons}/*.csv","Material Events/quarters_basel3.csv"]
    outputs: ["Material Events/Failures/Horizons/Peer_Group_Failures_Basel3_t{horizons}.csv","Material Events/Mergers/Horizons/Peer_Group_Mergers_Basel3_t{horizons}.csv","Material Events/Survivors/Horizons/Peer_Group_Survivors_Basel3_t{horizons}.csv"]
  "8.0":
    path: "jsd/binning/Material_events_JSD_binning_basel3.py"
    args: ["--horizons","{horizons}","--material-dir","Material Events","--bins1","{bins1}","--bins2","{bins2}","--bins3","{bins3}"]
    inputs: ["Material Events/Failures/Horizons/Peer_Group_Failures_Basel3_t{horizons}.csv","Material Events/Mergers/Horizons/Peer_Group_Mergers_Basel3_t{horizons}.csv","Material Events/Survivors/Horizons/Peer_Group_Survivors_Basel3_t{horizons}.csv"]
    outputs: ["Material Events/Failures/JS Divergence/Basel III T+{horizons}/Binned/Peer_Group_Failures_Basel3_t{horizons}_binned_{bins1}.csv","Material Events/Mergers/JS Divergence/Basel III T+{horizons}/Binned/Peer_Group_Mergers_Basel3_t{horizons}_binned_{bins1}.csv","Material Events/Survivors/JS Divergence/Basel III T+{horizons}/Binned/Peer_Group_Survivors_Basel3_t{horizons}_binned_{bins1}.csv"]
  "8.1.1":
    path: "jsd/pmf/Material_events_JSD_probabilities_basel3.py"
    args: ["--horizons","{horizons}","--material-dir","Material Events","--bins","{bins1}"]
    inputs: ["Material Events/Failures/JS Divergence/Basel III T+{horizons}/Binned/Peer_Group_Failures_Basel3_t{horizons}_binned_{bins1}.csv","Material Events/Mergers/JS Divergence/Basel III T+{horizons}/Binned/Peer_Group_Mergers_Basel3_t{horizons}_binned_{bins1}.csv","Material Events/Survivors/JS Divergence/Basel III T+{horizons}/Binned/Peer_Group_Survivors_Basel3_t{horizons}_binned_{bins1}.csv"]
    outputs: ["Material Events/Failures/JS Divergence/Basel III T+{horizons}/Probabilities/probabilities_Peer_Group_Failures_Basel3_t{horizons}_binned_{bins1}.csv","Material Events/Mergers/JS Divergence/Basel III T+{horizons}/Probabilities/probabilities_Peer_Group_Mergers_Basel3_t{horizons}_binned_{bins1}.csv","Material Events/Survivors/JS Divergence/Basel III T+{horizons}/Probabilities/probabilities_Peer_Group_Survivors_Basel3_t{horizons}_binned_{bins1}.csv"]
  "8.2":
    path: "jsd/calculation/Material_events_JSD_basel3.py"
    args: ["--horizons","{horizons}","--material-dir","Material Events","--bins","{bins1}"]
    inputs: ["Material Events/Failures/JS Divergence/Basel III T+{horizons}/Probabilities/probabilities_Peer_Group_Failures_Basel3_t{horizons}_binned_{bins1}.csv","Material Events/Mergers/JS Divergence/Basel III T+{horizons}/Probabilities/probabilities_Peer_Group_Mergers_Basel3_t{horizons}_binned_{bins1}.csv","Material Events/Survivors/JS Divergence/Basel III T+{horizons}/Probabilities/probabilities_Peer_Group_Survivors_Basel3_t{horizons}_binned_{bins1}.csv"]
    outputs: ["Material Events/JSD/BASEL III T+{horizons}/JSD_survivors_vs_failures_{bins1}.csv","Material Events/JSD/BASEL III T+{horizons}/JSD_survivors_vs_mergers_{bins1}.csv","Material Events/JSD/BASEL III T+{horizons}/JSD_mergers_vs_failures_{bins1}.csv"]
  "8.3.0.1":
    path: "measures/intragroup/JSD_intragroup_filter.py"
    args: ["--horizons","{horizons}","--material-dir","Material Events","--bins","{bins1}","--threshold",0.3]
    inputs: ["Material Events/JSD/BASEL III T+{horizons}/JSD_survivors_vs_failures_{bins1}.csv","Material Events/JSD/BASEL III T+{horizons}/JSD_survivors_vs_mergers_{bins1}.csv","Material Events/JSD/BASEL III T+{horizons}/JSD_mergers_vs_failures_{bins1}.csv"]
    outputs: ["Material Events/IG/BASEL III T+{horizons}/JSD_survivors_vs_failures_{bins1}.csv","Material Events/IG/BASEL III T+{horizons}/JSD_survivors_vs_mergers_{bins1}.csv","Material Events/IG/BASEL III T+{horizons}/JSD_mergers_vs_failures_{bins1}.csv"]

dependencies:
  "0.0": ["1.0"]
  "1.0": ["2.0"]
  "2.0": ["2.1"]
  "2.1": ["3.0"]
  "3.0": ["4.0"]
  "4.0": ["6.0.1","6.0.2","6.0.3"]
  "6.0.1": ["6.1"]
  "6.0.2": ["6.1"]
  "6.0.3": ["6.1"]
  "6.1": ["6.1.1"]
  "6.1.1": ["6.2"]
  "6.2": ["6.3"]
  "6.3": ["6.4"]
  "6.4": ["7.0"]
  "7.0": ["7.1"]
  "7.1": ["8.0"]
  "8.0": ["8.1.1"]
  "8.1.1": ["8.2"]
  "8.2": ["8.3.0.1"]

execution:
  - sequential: ["0.0", "1.0", "2.0", "2.1"]
  - sequential: ["3.0", "4.0"]
  - concurrent_groups:
      fdic_downloads: ["6.0.1", "6.0.2", "6.0.3"]
  - sequential: ["6.1", "6.1.1", "6.2", "6.3", "6.4"]
  - sequential: ["7.0", "7.1", "8.0"]
  - intermediate_steps: ["8.1.1"]
  - sequential: ["8.2"]
  - intermediate_steps: ["8.3.0.1"]
