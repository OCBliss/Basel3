# pipeline_config.yaml

scripts:
  "1.0":
    path: "call reports/call_reports_mkdir_txt_csvs_global.py"
    inputs: ["data/TXT/*/*.txt"]
    outputs: ["data/CSV/Schedules/*/*.csv"]
    create_dirs: ["data/CSV/Schedules"]
  "2.0":
    path: "call reports/Call_Report_Merged_Cleaned_Global.py"
    inputs: ["data/CSV/Schedules/*/*.csv"]
    outputs: ["data/CSV/Cleaned/*.csv"]
    create_dirs: ["data/CSV/Cleaned"]
  "2.1":
    path: "call reports/numeric_only.py"
    inputs: ["data/CSV/Cleaned/*.csv"]
  "3.0":
    path: "call reports/Call_Reports_v3_1.py"
    inputs: ["data/CSV/Cleaned/*.csv"]
    outputs: ["data/CSV/Interleaved/*.csv"]
    create_dirs: ["data/CSV/Interleaved"]
  "4.0":
    path: "ratios/Dynamic_Ratios.py"
    inputs:
      - "data/CSV/Cleaned/*.csv"
      - "data/CSV/Interleaved/*.csv"
      - "data/CSV/quarter_flag.csv"
    outputs: ["data/CSV/Dynamic_Lag/Cleaned/*.csv"]
    create_dirs: ["data/CSV/Dynamic_Lag/Cleaned"]
  "6.0.1":
    path: "material events/FDIC API/Material_events_download.py"
    args:
      - --events
      - de_novo
      - --material-dir
      - "Material Events"
      - --start-date
      - "2014-01-01"
      - --end-date
      - "2024-12-31"
      - --limit
      - 10000
    outputs: ["Material Events/DE NOVO/RAW/BankFind Suite API - de novo.csv"]
    create_dirs: ["Material Events/DE NOVO/RAW"]
  "6.0.2":
    path: "material events/FDIC API/Material_events_download.py"
    args:
      - --events
      - failures
      - --material-dir
      - "Material Events"
      - --start-date
      - "2014-01-01"
      - --end-date
      - "2024-12-31"
      - --limit
      - 10000
    outputs: ["Material Events/Failures/RAW/BankFind Suite API - Failures.csv"]
    create_dirs: ["Material Events/Failures/RAW"]
  "6.0.3":
    path: "material events/FDIC API/Material_events_download.py"
    args:
      - --events
      - mergers
      - --material-dir
      - "Material Events"
      - --start-date
      - "2014-01-01"
      - --end-date
      - "2024-12-31"
      - --limit
      - 10000
    outputs: ["Material Events/Mergers/RAW/BankFind Suite API - mergers.csv"]
    create_dirs: ["Material Events/Mergers/RAW"]
  "6.1":
    path: "material events/FDIC API/Material_events_cleaned.py"
    args:
      - --events
      - de_novo
      - failures
      - mergers
      - --material-dir
      - "Material Events"
    inputs:
      - "Material Events/DE NOVO/RAW/*.csv"
      - "Material Events/Failures/RAW/*.csv"
      - "Material Events/Mergers/RAW/*.csv"
    outputs:
      - "Material Events/DE NOVO/Cleaned/*.csv"
      - "Material Events/Failures/Cleaned/*.csv"
      - "Material Events/Mergers/Cleaned/*.csv"
    create_dirs:
      - "Material Events/DE NOVO/Cleaned"
      - "Material Events/Failures/Cleaned"
      - "Material Events/Mergers/Cleaned"
  "6.1.1":
    path: "material events/FDIC API/Material_events_delete_api.py"
    args:
      - --events
      - de_novo
      - failures
      - mergers
      - --material-dir
      - "Material Events"
    inputs:
      - "Material Events/DE NOVO/RAW/*.csv"
      - "Material Events/Failures/RAW/*.csv"
      - "Material Events/Mergers/RAW/*.csv"
  "6.2":
    path: "material events/Material_events_flag.py"
    args:
      - --events
      - de_novo
      - --material-dir
      - "Material Events"
      - --input-dir
      - "data/CSV/Dynamic_Lag/Cleaned"
      - --output-dir
      - "Material Events/DE NOVO/Call Reports"
      - --quarter-map
      - "Material Events/quarters_de_novo.csv"
    inputs:
      - "data/CSV/Dynamic_Lag/Cleaned/*.csv"
      - "Material Events/DE NOVO/Cleaned/*.csv"
      - "Material Events/quarters_de_novo.csv"
    outputs: ["Material Events/DE NOVO/Call Reports/*.csv"]
    create_dirs: ["Material Events/DE NOVO/Call Reports"]
  "6.3":
    path: "material events/Material_events_flag.py"
    args:
      - --events
      - failures
      - --material-dir
      - "Material Events"
      - --input-dir
      - "Material Events/DE NOVO/Call Reports"
      - --output-dir
      - "Material Events/Failures/Call Reports"
      - --quarter-map
      - "Material Events/quarters_failures.csv"
    inputs:
      - "Material Events/DE NOVO/Call Reports/*.csv"
      - "Material Events/Failures/Cleaned/*.csv"
      - "Material Events/quarters_failures.csv"
    outputs: ["Material Events/Failures/Call Reports/*.csv"]
    create_dirs: ["Material Events/Failures/Call Reports"]
  "6.4":
    path: "material events/Material_events_flag.py"
    args:
      - --events
      - mergers
      - --material-dir
      - "Material Events"
      - --input-dir
      - "Material Events/Failures/Call Reports"
      - --output-dir
      - "Material Events/Mergers/Call Reports"
      - --quarter-map
      - "Material Events/quarters_failures.csv"
    inputs:
      - "Material Events/Failures/Call Reports/*.csv"
      - "Material Events/Mergers/Cleaned/*.csv"
      - "Material Events/quarters_failures.csv"
    outputs: ["Material Events/Mergers/Call Reports/*.csv"]
    create_dirs: ["Material Events/Mergers/Call Reports"]
  "7.0.0.1":
    path: "peer groups/base/Material_events_peer_group_basel3_t1.py"
    inputs: ["Material Events/Mergers/Call Reports/*.csv"]
    outputs:
      - "Material Events/Failures/Horizons/Basel III T+1/*.csv"
      - "Material Events/Mergers/Horizons/Basel III T+1/*.csv"
      - "Material Events/Survivors/Horizons/Basel III T+1/*.csv"
  "7.0.0.2":
    path: "peer groups/base/Material_events_peer_group_basel3_t2.py"
    inputs: ["Material Events/Mergers/Call Reports/*.csv"]
    outputs:
      - "Material Events/Failures/Horizons/Basel III T+2/*.csv"
      - "Material Events/Mergers/Horizons/Basel III T+2/*.csv"
      - "Material Events/Survivors/Horizons/Basel III T+2/*.csv"
  "7.0.0.3":
    path: "peer groups/base/Material_events_peer_group_basel3_t3.py"
    inputs: ["Material Events/Mergers/Call Reports/*.csv"]
    outputs:
      - "Material Events/Failures/Horizons/Basel III T+3/*.csv"
      - "Material Events/Mergers/Horizons/Basel III T+3/*.csv"
      - "Material Events/Survivors/Horizons/Basel III T+3/*.csv"
  "7.0.0.4":
    path: "peer groups/base/Material_events_peer_group_basel3_t4.py"
    inputs: ["Material Events/Mergers/Call Reports/*.csv"]
    outputs:
      - "Material Events/Failures/Horizons/Basel III T+4/*.csv"
      - "Material Events/Mergers/Horizons/Basel III T+4/*.csv"
      - "Material Events/Survivors/Horizons/Basel III T+4/*.csv"
  "7.1.0.1":
    path: "peer groups/horizons/Material_events_peer_group_basel3_t1.py"
    inputs:
      - "Material Events/*/Horizons/Basel III T+1/*.csv"
      - "Material Events/quarters_basel3.csv"
    outputs: ["Material Events/*/Horizons/Peer_Group_*_Basel3_t1.csv"]
  "7.1.0.2":
    path: "peer groups/horizons/Material_events_peer_group_basel3_t2.py"
    inputs:
      - "Material Events/*/Horizons/Basel III T+2/*.csv"
      - "Material Events/quarters_basel3.csv"
    outputs: ["Material Events/*/Horizons/Peer_Group_*_Basel3_t2.csv"]
  "7.1.0.3":
    path: "peer groups/horizons/Material_events_peer_group_basel3_t3.py"
    inputs:
      - "Material Events/*/Horizons/Basel III T+3/*.csv"
      - "Material Events/quarters_basel3.csv"
    outputs: ["Material Events/*/Horizons/Peer_Group_*_Basel3_t3.csv"]
  "7.1.0.4":
    path: "peer groups/horizons/Material_events_peer_group_basel3_t4.py"
    inputs:
      - "Material Events/*/Horizons/Basel III T+4/*.csv"
      - "Material Events/quarters_basel3.csv"
    outputs: ["Material Events/*/Horizons/Peer_Group_*_Basel3_t4.csv"]
  "8.0.1":
    path: "jsd/binning/Material_events_JSD_binning_basel3_20.py"
    inputs: ["Material Events/*/Horizons/Peer_Group_*_Basel3_t*.csv"]
    outputs: ["Material Events/*/JS Divergence/Basel III T+*/Binned/*_bins20.csv"]
  "8.0.2":
    path: "jsd/binning/Material_events_JSD_binning_basel3_30.py"
    inputs: ["Material Events/*/Horizons/Peer_Group_*_Basel3_t*.csv"]
    outputs: ["Material Events/*/JS Divergence/Basel III T+*/Binned/*_bins30.csv"]
  "8.0.3":
    path: "jsd/binning/Material_events_JSD_binning_basel3_50.py"
    inputs: ["Material Events/*/Horizons/Peer_Group_*_Basel3_t*.csv"]
    outputs: ["Material Events/*/JS Divergence/Basel III T+*/Binned/*_bins50.csv"]
  "8.0.4":
    path: "jsd/binning/Material_events_JSD_binning_basel3_100.py"
    inputs: ["Material Events/*/Horizons/Peer_Group_*_Basel3_t*.csv"]
    outputs: ["Material Events/*/JS Divergence/Basel III T+*/Binned/*_bins100.csv"]
  "8.1.1":
    path: "jsd/pmf/Material_events_JSD_probabilities_basel3.py"
    inputs: ["Material Events/*/JS Divergence/Basel III T+*/Binned/*.csv"]
    outputs: ["Material Events/*/JS Divergence/Basel III T+*/Probabilities/probabilities_*.csv"]
  "8.2.0.1":
    path: "jsd/calculation/Material_events_JSD_basel3_t1.py"
    inputs: ["Material Events/*/JS Divergence/Basel III T+1/Probabilities/*.csv"]
    outputs: ["Material Events/JSD/BASEL III T+1/*.csv"]
    create_dirs: ["Material Events/JSD/BASEL III T+1"]
  "8.2.0.2":
    path: "jsd/calculation/Material_events_JSD_basel3_t2.py"
    inputs: ["Material Events/*/JS Divergence/Basel III T+2/Probabilities/*.csv"]
    outputs: ["Material Events/JSD/BASEL III T+2/*.csv"]
    create_dirs: ["Material Events/JSD/BASEL III T+2"]
  "8.2.0.3":
    path: "jsd/calculation/Material_events_JSD_basel3_t3.py"
    inputs: ["Material Events/*/JS Divergence/Basel III T+3/Probabilities/*.csv"]
    outputs: ["Material Events/JSD/BASEL III T+3/*.csv"]
    create_dirs: ["Material Events/JSD/BASEL III T+3"]
  "8.2.0.4":
    path: "jsd/calculation/Material_events_JSD_basel3_t4.py"
    inputs: ["Material Events/*/JS Divergence/Basel III T+4/Probabilities/*.csv"]
    outputs: ["Material Events/JSD/BASEL III T+4/*.csv"]
    create_dirs: ["Material Events/JSD/BASEL III T+4"]
  "8.3.0.1":
    path: "measures/intragroup/JSD_intragroup_filter.py"
    inputs: ["Material Events/JSD/BASEL III T+*/*.csv"]
    outputs: ["Material Events/IG/BASEL III T+*/*.csv"]
