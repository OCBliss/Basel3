dependencies:
  "1.0": ["2.0"]
  "2.0": ["2.1"]
  "2.1": ["3.0"]
  "3.0": ["4.0"]
  "4.0": ["6.0.1", "6.0.2", "6.0.3"]
  "6.0.1": ["6.1"]
  "6.0.2": ["6.1"]
  "6.0.3": ["6.1"]
  "6.1": ["6.1.1"]
  "6.1.1": ["6.2"]
  "6.2": ["6.3"]
  "6.3": ["6.4"]
  "6.4": ["7.0.0.1", "7.0.0.2", "7.0.0.3", "7.0.0.4"]
  "7.0.0.1": ["7.1.0.1"]
  "7.0.0.2": ["7.1.0.2"]
  "7.0.0.3": ["7.1.0.3"]
  "7.0.0.4": ["7.1.0.4"]
  "7.1.0.1": ["8.0.1"]  # Each filter step only triggers its corresponding binning step
  "7.1.0.2": ["8.0.2"]
  "7.1.0.3": ["8.0.3"]
  "7.1.0.4": ["8.0.4"]
  "8.0.1": ["8.1.1"]
  "8.0.2": ["8.1.1"]
  "8.0.3": ["8.1.1"]
  "8.0.4": ["8.1.1"]
  "8.1.1": ["8.2.0.1", "8.2.0.2", "8.2.0.3", "8.2.0.4"]
  "8.2.0.1": ["8.3.0.1"]
  "8.2.0.2": ["8.3.0.1"]
  "8.2.0.3": ["8.3.0.1"]
  "8.2.0.4": ["8.3.0.1"]
  # "8.3.0.1": ["8.3.0.2.20"]
  # "8.3.0.2.20": ["8.3.0.3.20"]

execution:
  # This is an ordered list of phase mappings. Repeated phase types are valid
  # because every occurrence is a distinct list item and therefore a barrier.
  - sequential: ["1.0", "2.0", "2.1"]  # Initial data preparation
  - sequential: ["3.0", "4.0"]  # RC-B analysis
  - concurrent_groups:
      fdic_downloads: ["6.0.1", "6.0.2", "6.0.3"]
  - sequential: ["6.1", "6.1.1", "6.2", "6.3", "6.4"]  # Material-event flags
  - concurrent_groups:
      peer_groups: ["7.0.0.1", "7.0.0.2", "7.0.0.3", "7.0.0.4"]
  - concurrent_groups:
      horizon_filters: ["7.1.0.1", "7.1.0.2", "7.1.0.3", "7.1.0.4"]
  - concurrent_groups:
      binning: ["8.0.1", "8.0.2", "8.0.3", "8.0.4"]
  - intermediate_steps: ["8.1.1"]  # PMF barrier after all bins complete
  - concurrent_branches:
      t1:
        - sequential: ["8.2.0.1"]
      t2:
        - sequential: ["8.2.0.2"]
      t3:
        - sequential: ["8.2.0.3"]
      t4:
        - sequential: ["8.2.0.4"]
  - intermediate_steps: ["8.3.0.1"]  # Rejoin after every JSD horizon
