parameters:
  snapshot_dir: RWA/FRED/snapshots/2026-09-13-live
  output_dir: RWA/Experimental/HIERARCHY/2026-09-13-live
  start: '2010-01-01'
  max_fill_days: 7
  max_age_days: 7
  yield_window: 2520
  parameter_window: 252
  recent_rows: 3024
  paths: 256
  steps: 20
  substeps: 4
  seed: 1234
scripts:
  acquire_yields:
    path: RWA/data/yields/acquire.py
    args:
    - --output
    - '{snapshot_dir}'
    - --start
    - '{start}'
    - --max-fill-days
    - '{max_fill_days}'
    - --max-age-days
    - '{max_age_days}'
    outputs:
    - '{snapshot_dir}/snapshot.json'
    - '{snapshot_dir}/raw/fred.csv'
    - '{snapshot_dir}/series/DGS*.csv'
  rwa_hierarchy:
    path: RWA/models/parameter_hierarchy/workflow.py
    args:
    - --input
    - '{snapshot_dir}/series'
    - --input-manifest
    - '{snapshot_dir}/snapshot.json'
    - --output
    - '{output_dir}'
    - --yield-window
    - '{yield_window}'
    - --parameter-window
    - '{parameter_window}'
    - --recent-rows
    - '{recent_rows}'
    - --paths
    - '{paths}'
    - --steps
    - '{steps}'
    - --substeps
    - '{substeps}'
    - --seed
    - '{seed}'
    inputs:
    - '{snapshot_dir}/snapshot.json'
    - '{snapshot_dir}/series/DGS*.csv'
    outputs:
    - '{output_dir}/manifest.json'
    - '{output_dir}/parameter_dynamics.csv'
    - '{output_dir}/scenario_summary.csv'
    - '{output_dir}/scenarios.npz'
dependencies:
  acquire_yields:
  - rwa_hierarchy
execution:
- sequential:
  - acquire_yields
  - rwa_hierarchy
log_root: .codex-engineering/runs/2026-09-13-yield-acquisition/tmp/pipeline-logs
